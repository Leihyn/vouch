<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vouch">
  <title>Vouch</title>
  <defs><clipPath id="sq"><rect width="512" height="512" rx="104"/></clipPath></defs>
  <g clip-path="url(#sq)">
    <rect width="512" height="512" fill="#f6f7fa"/>
    <!-- the path that exists: service - agent - voucher -->
    <path d="M124 168 L256 366 L388 168" fill="none" stroke="#4f46e5" stroke-width="26"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the link that does not: service never speaks to voucher -->
    <line x1="124" y1="168" x2="388" y2="168" stroke="#c9cee0" stroke-width="12" stroke-dasharray="4 34" stroke-linecap="round"/>
    <circle cx="124" cy="168" r="50" fill="#f6f7fa"/><circle cx="124" cy="168" r="36" fill="#0d9488"/>
    <circle cx="388" cy="168" r="50" fill="#f6f7fa"/><circle cx="388" cy="168" r="36" fill="#b45309"/>
    <circle cx="256" cy="366" r="52" fill="#f6f7fa"/><circle cx="256" cy="366" r="38" fill="#4f46e5"/>
  </g>
</svg>
